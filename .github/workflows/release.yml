name: Release

# Builds standalone Windows binaries (x64 + ARM64) on tag pushes and attaches
# them to a GitHub Release. Tag a release on main with `git tag v0.1.0 && git
# push --tags` and this workflow runs, builds both architectures, and publishes.
#
# The build itself is identical across architectures — PyInstaller produces a
# native binary for whatever arch the runner is. We rename the output to make
# the architecture explicit in the release-asset filename.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # also runnable manually from the Actions tab

# Opt every JS-based action into the Node.js 24 runtime. The runner-wide
# default flips to Node 24 in mid-2026; setting this explicitly silences the
# deprecation warnings now and keeps things working for any action that
# still ships a Node 20 entry point (e.g. softprops/action-gh-release@v2 as
# of early 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
            # ARM64-only knobs: build cryptography from sdist against a
            # vcpkg-supplied OpenSSL because pyca/cryptography stopped
            # publishing win_arm64 wheels after 46.0.0. See pyca/cryptography
            # issue #14168 and snowflakedb/universal-driver PR #984 for
            # context. Empty on x64.
            build_from_source: "1"
            openssl_dir: "C:/vcpkg/installed/arm64-windows-static-md"
            openssl_lib_dir: "C:/vcpkg/installed/arm64-windows-static-md/lib"

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # needed to create the release and upload assets

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Install UPX
        # Windows runners ship with Chocolatey pre-installed. UPX 4.1+ can
        # compress both x64 and ARM64 PE binaries. If choco fails on the
        # ARM64 runner the build script falls back gracefully (binary is a
        # few MB larger; everything still works).
        shell: bash
        run: choco install upx -y --no-progress || echo "[ci] upx install failed; build will skip compression"

      - name: Cache vcpkg-built OpenSSL
        # ARM64 only: caches the output of `vcpkg install openssl:arm64-...`
        # so subsequent runs don't pay the 10-15 minute build cost. Bump
        # the trailing -vN if you need to invalidate (e.g. vcpkg port major
        # bump or a corruption suspicion).
        if: matrix.arch == 'arm64'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-openssl-arm64-windows-static-md-v1

      - name: Install OpenSSL via vcpkg (ARM64)
        # Skipped silently when the cache step above restored the install
        # tree. On a fresh cache this builds OpenSSL from source for the
        # arm64-windows-static-md triplet and takes 10-15 minutes.
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "/c/vcpkg/installed/arm64-windows-static-md/lib" ]; then
            echo "[ci] vcpkg OpenSSL restored from cache"
            ls /c/vcpkg/installed/arm64-windows-static-md/lib | head
          else
            echo "[ci] cache miss; building OpenSSL via vcpkg (10-15 minutes expected)"
            cd /c/vcpkg
            ./vcpkg install openssl:arm64-windows-static-md
          fi

      - name: Build standalone .exe
        shell: bash
        # On x64 these env vars are empty strings and build.sh follows the
        # default wheel-only path. On ARM64 BUILD_CRYPTOGRAPHY_FROM_SOURCE
        # is set, build.sh adds --no-binary cryptography to pip, and
        # cryptography's openssl-sys crate picks up the OpenSSL we built
        # via vcpkg from the OPENSSL_* env vars.
        env:
          BUILD_CRYPTOGRAPHY_FROM_SOURCE: ${{ matrix.build_from_source || '' }}
          OPENSSL_DIR: ${{ matrix.openssl_dir || '' }}
          OPENSSL_LIB_DIR: ${{ matrix.openssl_lib_dir || '' }}
          OPENSSL_STATIC: ${{ matrix.build_from_source || '' }}
        run: ./build/build.sh

      - name: Rename output with architecture suffix
        shell: bash
        run: |
          mv build/dist/proxy_settings.exe "build/dist/proxy_settings-windows-${{ matrix.arch }}.exe"
          ls -lh build/dist/

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=manual-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload as workflow artifact
        # Always uploaded so manual runs (workflow_dispatch) produce a
        # downloadable binary even without creating a release.
        uses: actions/upload-artifact@v5
        with:
          name: proxy_settings-${{ steps.tag.outputs.name }}-windows-${{ matrix.arch }}
          path: build/dist/proxy_settings-windows-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        # Only on actual tag pushes — manual runs just produce the artifact.
        # softprops/action-gh-release adds the file to an existing release of
        # the same tag (or creates one), so both matrix jobs end up attaching
        # their binary to the same release without conflict.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/proxy_settings-windows-${{ matrix.arch }}.exe
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
